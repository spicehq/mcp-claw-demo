# Injects the X-API-Key header that v2 Spice requires on /v1/mcp and /v1/tools.
# The main Spice's rmcp client (rmcp 1.5, called via from_uri) does not surface
# a way to send custom headers, so we authenticate here on its behalf.

events {}

http {
    server {
        listen 8090;

        location / {
            proxy_pass http://claw-platform:8090;

            # Inject the demo key.
            proxy_set_header X-API-Key claw-platform-demo-key;

            # Preserve normal proxy headers.
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

            # MCP Streamable HTTP uses SSE for the long-lived response stream.
            # Buffering must be off and idle timeouts long.
            proxy_http_version 1.1;
            proxy_buffering   off;
            proxy_cache       off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }
    }
}
